version: "superwork.world/v1"
world:
  name: "AI Smart Stock Asset Management & Portfolio Orchestrator"
  mission: "실시간 검색 선행 수집 가드와 3각 팩트 대조를 통해 6대 포지션 액션과 무결점 원장 데이터를 사용자 온디맨드로 동기화한다."

entities:
  ComprehensiveDailyReport:
    owned_state: true
    attributes:
      session_id: string
      session_timestamp: string
      trigger_source: string         # "on_demand_user"
      fact_status: string            # "pending" | "completed" | "failed"
      quant_status: string           # "pending" | "completed" | "failed"
      audit_status: string           # "pending" | "completed" | "failed"
      macro_data_sane: string        # "yes" | "no"
      text_data_aligned: string      # "yes" | "no"
      contains_raw_url: string       # "yes" | "no"
      grade_classification: string   # "6_tier_action_matrix"

roles:
  - MarketFactSearcher      # 실시간 검색 도구 호출하여 당일 국내/해외 매크로 및 수급 수집
  - QuantEngine             # Fchart 기반 캔들, 이평선, RSI, 20일선 이격도 정밀 연산
  - AuditInspector          # DART 공시 및 재무 건전성(ROE, 부채비율) 감사
  - StrategyOrchestrator    # 3각 팩트 대조, 6대 액션 도출, 리스크 비교, 불릿 요약 생성
  - RuntimeCommitter        # 사용자 승인(Human-in-the-Loop) 시 원장 확정 및 로컬 저장

states:
  - idle                    # 상시 무비용 대기 상태 (Zero-cost static inspection)
  - trigger_requested       # 사용자 [AI 종합 분석 개시] 온디맨드 요청 수신
  - fact_retrieved          # 실시간 매크로/수급 팩트 선행 수집 완료 상태
  - analyzed                # 퀀트 기술지표 및 재무 건전성 감사 완료 상태
  - under_review            # 3각 팩트 대조 및 6대 액션/불릿 합성 완료, 사용자 검토 대기
  - committed               # [Terminal] 사용자 승인 및 로컬 원장(holdings.json) 동기화 완료
  - requires_recheck        # [Failure Gate] 비정상 URL 또는 데이터 불일치 감지 격리

transitions:
  request_trigger:
    from: idle
    to: trigger_requested
    roles: [RuntimeCommitter]

  fetch_market_facts:
    from: trigger_requested
    to: fact_retrieved
    roles: [MarketFactSearcher]
    guards:
      - record.trigger_source == "on_demand_user"

  execute_quant_and_audit:
    from: fact_retrieved
    to: analyzed
    roles: [QuantEngine, AuditInspector]
    guards:
      - record.fact_status == "completed"

  synthesize_and_orchestrate:
    from: analyzed
    to: under_review
    roles: [StrategyOrchestrator]
    guards:
      - record.quant_status == "completed"
      - record.audit_status == "completed"
      - record.contains_raw_url == "no"
      - record.macro_data_sane == "yes"

  flag_discrepancy:
    from: analyzed
    to: requires_recheck
    roles: [StrategyOrchestrator]
    guards:
      - record.contains_raw_url == "yes"

  commit_report:
    from: under_review
    to: committed
    roles: [RuntimeCommitter]

  reset_session:
    from: [committed, requires_recheck]
    to: idle
    roles: [RuntimeCommitter]
